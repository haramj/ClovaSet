name: clovaset-public-demo

services:
  mysql:
    image: mysql:8.4.11
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: clovaset
      MYSQL_USER: clovaset
      MYSQL_PASSWORD: ${DEMO_DB_PASSWORD:?Set DEMO_DB_PASSWORD in .env.demo}
      MYSQL_ROOT_PASSWORD: ${DEMO_DB_ROOT_PASSWORD:?Set DEMO_DB_ROOT_PASSWORD in .env.demo}
    volumes:
      - demo_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u clovaset -p$$MYSQL_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.demo
    image: clovaset-api-demo:local
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    environment:
      DB_URL: jdbc:mysql://mysql:3306/clovaset?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Seoul
      DB_USERNAME: clovaset
      DB_PASSWORD: ${DEMO_DB_PASSWORD:?Set DEMO_DB_PASSWORD in .env.demo}
      DEMO_ACCESS_CODE: ${DEMO_ACCESS_CODE:?Set DEMO_ACCESS_CODE in .env.demo}
      WEB_ORIGIN: https://haramj.github.io
      MAX_CLOTHES: 50
      PORT: 8080
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  demo_mysql:
