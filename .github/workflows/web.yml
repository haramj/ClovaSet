name: Web CI and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Test developer setup
        run: node --test scripts/*.test.mjs
      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci
      - name: Check formatting
        working-directory: apps/web
        run: npx prettier --check src index.html package.json
      - name: Build for GitHub Pages
        working-directory: apps/web
        run: npm run build -- --base=/sharedclothes/
      - name: Verify deployment artifact
        run: node scripts/verify-build.mjs
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: apps/web/dist

  api:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      mysql:
        image: mysql:8.4.11
        env:
          MYSQL_DATABASE: clovaset
          MYSQL_USER: clovaset
          MYSQL_PASSWORD: clovaset_local
          MYSQL_ROOT_PASSWORD: clovaset_root_local
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u clovaset -pclovaset_local --silent"
          --health-interval=10s --health-timeout=5s --health-retries=12
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
          cache-dependency-path: apps/api/pom.xml
      - name: Test Spring API and MySQL migrations
        working-directory: apps/api
        run: ./mvnw -B test

  deploy:
    if: github.event_name != 'pull_request'
    needs: [build, api]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
