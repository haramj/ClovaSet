spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/clovaset?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Seoul}
    username: ${DB_USERNAME:clovaset}
    password: ${DB_PASSWORD:clovaset_local}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  flyway:
    enabled: true
server:
  port: ${PORT:8080}
app:
  web-origin: ${WEB_ORIGIN:http://localhost:5173}
