services:
  mysql:
    image: mysql:8.4.11
    environment:
      MYSQL_DATABASE: clovaset
      MYSQL_USER: clovaset
      MYSQL_PASSWORD: ${DB_PASSWORD:-clovaset_local}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-clovaset_root_local}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - clovaset_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u clovaset -p$$MYSQL_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  clovaset_mysql:
